<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,follow"/>
<title>Thank you | COP Angel</title>
<meta name="description" content="Thank you for your interest in COP Angel"/>
<style>
:root{color-scheme:light;--ink:#142821;--green:#218848;--muted:#54665b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 80% 15%,#e4f4d8,transparent 45%),#f8fbf5;min-height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid #dce5db;background:#ffffffb8}
.wrap{width:min(1124px,100%);margin:auto;padding:22px 28px}
.logo{display:block;width:132px;height:69px;object-fit:contain;object-position:left center}
main{flex:1;display:grid;place-items:center;padding:55px 24px}
.card{width:min(720px,100%);padding:clamp(30px,6vw,68px);background:#fff;border:1px solid #dce5db;border-radius:22px;box-shadow:0 24px 70px #1639240d}
.check{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:#e8f5de;color:var(--green);margin-bottom:27px}
.check svg{width:31px;height:31px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--green);text-transform:uppercase}
h1{font-size:clamp(34px,5vw,52px);line-height:1.12;letter-spacing:-.045em;margin:17px 0 22px}
p{font-size:18px;line-height:1.65;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:25px;background:var(--green);color:white;padding:15px 22px;border-radius:7px;text-decoration:none;font-size:14px;font-weight:700;margin-top:12px}
.btn:hover{background:#176c39}
a:focus-visible{outline:3px solid #94ce54;outline-offset:5px}
.contact{font-size:13px;margin-top:28px;margin-bottom:0}.contact a{color:var(--green);text-underline-offset:3px}
footer{font-size:12px;color:#62716a}
</style>
</head>
<body>
<header><div class="wrap"><a href="./" aria-label="COP Angel home"><img class="logo" src="copangel-logo.png" alt="COP Angel" width="132" height="69"/></a></div></header>
<main><section class="card" aria-labelledby="thanksTitle"><div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div><div class="eyebrow">Your next chapter with COP Angel</div><h1 id="thanksTitle">Thank you for your interest in COP Angel</h1><p>We will be in touch shortly to update you on progress.</p><a class="btn" href="./">Back to the website <span aria-hidden="true">→</span></a><p class="contact">Need to add anything? Email <a href="mailto:info@copangel.com">info@copangel.com</a></p></section></main>
<footer><div class="wrap">© 2026 COP Angel Ltd · Intelligent heating, tailored to your home</div></footer>
</body>
</html>
