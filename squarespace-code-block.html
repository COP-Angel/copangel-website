ht:42%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:38%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:52%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:58%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:67%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:74%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:69%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:80%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:75%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:85%&quot;&gt;&lt;/b&gt;&lt;b style=&quot;height:92%&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;dashfoot&quot;&gt;Concept illustration — not live COP Angel telemetry or validated performance data.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;visualnote&quot;&gt;REPLACE WITH ACTUAL SOFTWARE SCREENSHOTS&lt;/div&gt;&lt;div class=&quot;floating&quot;&gt;&lt;small&gt;SMARTER CONTROL&lt;/small&gt;&lt;strong&gt;Every room.&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;strip&quot;&gt;&lt;div class=&quot;wrap stripgrid&quot;&gt;&lt;div class=&quot;stripitem&quot;&gt;&lt;strong&gt;Patented approach&lt;/strong&gt;UK invention and IP&lt;/div&gt;&lt;div class=&quot;stripitem&quot;&gt;&lt;strong&gt;2 real homes&lt;/strong&gt;Working prototype installations&lt;/div&gt;&lt;div class=&quot;stripitem&quot;&gt;&lt;strong&gt;Software developed&lt;/strong&gt;Commissioning and optimisation&lt;/div&gt;&lt;div class=&quot;stripitem&quot;&gt;&lt;strong&gt;Next: validation&lt;/strong&gt;Independent testing planned&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot; id=&quot;technology&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;sectionhead&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;The COP Angel advantage&lt;/div&gt;&lt;h2&gt;One intelligent system.&lt;br/&gt;Four meaningful benefits.&lt;/h2&gt;&lt;p&gt;Conventional heating controls aren&#x27;t always equipped to optimise an entire low-temperature system. COP Angel brings the heating circuit, individual rooms and heat pump together.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;four&quot;&gt;&lt;article class=&quot;benefit&quot;&gt;&lt;div class=&quot;symbol&quot;&gt;⚙&lt;/div&gt;&lt;h3&gt;Automatic commissioning&lt;/h3&gt;&lt;p&gt;Designed to simplify balancing and system setup, reducing manual tuning during installation.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;benefit&quot;&gt;&lt;div class=&quot;symbol&quot;&gt;⌂&lt;/div&gt;&lt;h3&gt;Room-by-room comfort&lt;/h3&gt;&lt;p&gt;Independent room targets with coordinated control across radiators and underfloor heating.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;benefit&quot;&gt;&lt;div class=&quot;symbol&quot;&gt;↘&lt;/div&gt;&lt;h3&gt;Optimised efficiency&lt;/h3&gt;&lt;p&gt;Continuously seek the lowest practical flow temperature while meeting the home&#x27;s heating needs.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;benefit&quot;&gt;&lt;div class=&quot;symbol&quot;&gt;✦&lt;/div&gt;&lt;h3&gt;Whole-home intelligence&lt;/h3&gt;&lt;p&gt;House optimisation, upgrade analysis and ROI insights in one developing software platform.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section alt&quot; id=&quot;software&quot;&gt;&lt;div class=&quot;wrap split&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;The technology in action&lt;/div&gt;&lt;h2&gt;It starts with understanding every room.&lt;/h2&gt;&lt;p&gt;COP Angel uses a patented control approach to balance heat delivery at radiators and underfloor zones, then adjusts heat pump operating temperatures to match the home&#x27;s needs.&lt;/p&gt;&lt;div class=&quot;numbered&quot;&gt;&lt;b&gt;01&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Measure what matters&lt;/strong&gt;&lt;span&gt;Room and heating-system feedback informs decisions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;numbered&quot;&gt;&lt;b&gt;02&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Balance automatically&lt;/strong&gt;&lt;span&gt;Coordinate heat distribution across the property.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;numbered&quot;&gt;&lt;b&gt;03&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Optimise the whole home&lt;/strong&gt;&lt;span&gt;Maintain comfort while seeking more efficient conditions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;imgplace&quot;&gt;&lt;svg viewBox=&quot;0 0 64 64&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;&gt;&lt;rect x=&quot;7&quot; y=&quot;12&quot; width=&quot;50&quot; height=&quot;37&quot; rx=&quot;5&quot;/&gt;&lt;path d=&quot;M7 22h50M19 58h26M32 49v9M14 30h15M14 36h22M44 30h7M44 36h7&quot;/&gt;&lt;/svg&gt;&lt;strong&gt;Actual software screenshots go here&lt;/strong&gt;&lt;small&gt;Commissioning • whole-house optimisation • upgrade ROI analysis&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot; id=&quot;progress&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;sectionhead&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Built. Tested. Moving forward.&lt;/div&gt;&lt;h2&gt;From invention to real-world deployment.&lt;/h2&gt;&lt;p&gt;We&#x27;ve progressed beyond an initial concept. Our next steps focus on independent evidence, practical field trials and preparation for manufacturing.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;milestones&quot;&gt;&lt;article class=&quot;milestone&quot;&gt;&lt;div class=&quot;status&quot;&gt;● Achieved&lt;/div&gt;&lt;h3&gt;UK patent&lt;/h3&gt;&lt;p&gt;Core control invention protected in the UK; international applications pending.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;milestone&quot;&gt;&lt;div class=&quot;status&quot;&gt;● Achieved&lt;/div&gt;&lt;h3&gt;Two prototypes&lt;/h3&gt;&lt;p&gt;Working prototypes developed, tested and installed in two residential properties.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;milestone future&quot;&gt;&lt;div class=&quot;status&quot;&gt;◌ Planned&lt;/div&gt;&lt;h3&gt;Independent testing&lt;/h3&gt;&lt;p&gt;University of Salford validation project scheduled; additional university discussions ongoing.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;milestone future&quot;&gt;&lt;div class=&quot;status&quot;&gt;◌ Target 2027&lt;/div&gt;&lt;h3&gt;Pilot programme&lt;/h3&gt;&lt;p&gt;Planning for broader trials and continued manufacturing discussions.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;Development milestones and testing status are based on COP Angel project updates supplied in November 2026. Independent performance outcomes have not yet been published.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section alt&quot; id=&quot;audiences&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;sectionhead&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Shape what happens next&lt;/div&gt;&lt;h2&gt;Different perspectives.&lt;br/&gt;One better way to heat.&lt;/h2&gt;&lt;p&gt;Whether you&#x27;re installing heat pumps, planning a home upgrade or considering investment, there&#x27;s a way to be part of COP Angel&#x27;s next chapter.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;audiences&quot;&gt;&lt;article class=&quot;audience&quot;&gt;&lt;div class=&quot;audtop&quot;&gt;⌂&lt;/div&gt;&lt;div class=&quot;audbody&quot;&gt;&lt;h3&gt;For homeowners&lt;/h3&gt;&lt;p&gt;Interested in simpler, more comfortable and potentially lower-cost heating? Register for product news and potential priority consideration for 2027 pilots.&lt;/p&gt;&lt;a href=&quot;#register&quot; data-interest=&quot;homeowner&quot;&gt;Join the priority list →&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;audience&quot;&gt;&lt;div class=&quot;audtop&quot;&gt;⚒&lt;/div&gt;&lt;div class=&quot;audbody&quot;&gt;&lt;h3&gt;For installers&lt;/h3&gt;&lt;p&gt;Explore a future tool designed to simplify commissioning and help make heat pump performance more predictable for customers.&lt;/p&gt;&lt;a href=&quot;#register&quot; data-interest=&quot;installer&quot;&gt;Register installer interest →&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;audience&quot;&gt;&lt;div class=&quot;audtop&quot;&gt;↗&lt;/div&gt;&lt;div class=&quot;audbody&quot;&gt;&lt;h3&gt;For investors&lt;/h3&gt;&lt;p&gt;Discover a UK-patented technology, working prototypes and an emerging hardware-plus-software commercial model.&lt;/p&gt;&lt;a href=&quot;#investors&quot;&gt;Explore the opportunity →&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;dark&quot; id=&quot;investors&quot;&gt;&lt;div class=&quot;wrap darkgrid&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Partner in the next stage&lt;/div&gt;&lt;h2&gt;Backing the future of intelligent heating.&lt;/h2&gt;&lt;p&gt;COP Angel is advancing towards independent validation and a UK-first commercialisation pathway. We welcome conversations with investors who can offer capital, expertise, manufacturing capability or routes to market.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-interest=&quot;investor&quot;&gt;Request investor information &lt;span&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;darkcard&quot;&gt;&lt;h3&gt;Why now?&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Patented UK control technology&lt;/li&gt;&lt;li&gt;Working prototype installations&lt;/li&gt;&lt;li&gt;Developed software application&lt;/li&gt;&lt;li&gt;Manufacturing and distribution discussions underway&lt;/li&gt;&lt;li&gt;2027 pilot programme in planning&lt;/li&gt;&lt;/ul&gt;&lt;p style=&quot;font-size:11px;margin:14px 0 0&quot;&gt;This page is a company overview, not an offer of securities. Financing terms are not yet finalised.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
